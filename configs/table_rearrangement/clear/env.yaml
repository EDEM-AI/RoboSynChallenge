environment_id: table_rearrangement_clear
physics: default
max_episodes: 100
max_episode_steps: 1400
simulation:
  light:
    direct:
    - uid: light_0
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      init_pos:
      - 0.8
      - 0.0
      - 2.0
      radius: 20.0
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.0
      - 1.0
      - 0.1
      visual_material:
        uid: white_table_mat
        base_color:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.775
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_back_wall
    shape:
      shape_type: Cube
      size:
      - 0.04
      - 2.2
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  rigid_object:
  - uid: plate
    shape:
      shape_type: Mesh
      fpath: TableWare/tableware/plate/3_center.ply
      compute_uv: true
      visual_material:
        uid: plate_warm_gray_mat
        base_color:
        - 0.7
        - 0.69
        - 0.67
        - 1.0
        metallic: 0.0
        roughness: 0.7
    body_scale:
    - 0.001
    - 0.001
    - 0.001
    init_pos:
    - 0.5
    - 0.0
    - 1.0
    init_rot:
    - 180
    - 0
    - 0
  - uid: fork
    shape:
      shape_type: Mesh
      fpath: TableWare/tableware/fork/standard_fork_scale.ply
      compute_uv: true
      visual_material:
        uid: fork_silver_metal_mat
        base_color:
        - 0.52
        - 0.52
        - 0.51
        - 1.0
        metallic: 1.0
        roughness: 0.38
    body_scale:
    - 1.0
    - 1.0
    - 1.0
    init_pos:
    - 0.5
    - 0.21
    - 1.0
    attrs:
      mass_props:
        mass: 0.01
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.05
      rigid_props:
        min_position_iters: 16
        min_velocity_iters: 4
  - uid: spoon
    shape:
      shape_type: Mesh
      fpath: TableWare/tableware/spoon/standard_spoon_a_rescale.ply
      compute_uv: true
      visual_material:
        uid: spoon_silver_metal_mat
        base_color:
        - 0.52
        - 0.52
        - 0.51
        - 1.0
        metallic: 1.0
        roughness: 0.38
    body_scale:
    - 1.0
    - 1.0
    - 1.0
    init_pos:
    - 0.5
    - -0.21
    - 1.0
    attrs:
      mass_props:
        mass: 0.01
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.05
      rigid_props:
        min_position_iters: 16
        min_velocity_iters: 4
env:
  task_instruction: Pick the fork and the spoon, place them next to the plate.
  target_control_frequency: 25
  events:
    init_fork_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: fork
        position_range:
        - - 0.4
          - 0.15
          - 0.83
        - - 0.65
          - 0.3
          - 0.83
        rotation_range:
        - - 0
          - 0
          - -45
        - - 0
          - 0
          - 45
        relative_position: false
        relative_rotation: false
    init_spoon_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: spoon
        position_range:
        - - 0.4
          - -0.3
          - 0.83
        - - 0.65
          - -0.15
          - 0.83
        rotation_range:
        - - 0
          - 0
          - -45
        - - 0
          - 0
          - 45
        relative_position: false
        relative_rotation: false
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/table_rearrangement
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          arm_dofs: 12
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Pick the fork and the spoon, place them next to the plate.
        extra:
          scene_type: Sim
          task_description: table_rearrangement
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
