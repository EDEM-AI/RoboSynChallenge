      drive_type: force
      stiffness: 100.0
      damping: 30.0
      max_effort: 200.0
      max_velocity: 2.0
    asset_physics_mode: overlay
  rigid_object:
  - uid: distractor_0
    shape:
      shape_type: Mesh
      fpath: ../../../robosynchallenge/Distractor/PaperCup/paper_cup.ply
      compute_uv: true
    attrs:
      mass_props:
        mass: 0.01
      material_props:
