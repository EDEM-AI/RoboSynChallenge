contract_id: single_arm_parallel_gripper
profile_id: cobotmagic
resources:
  - resource_id: primary_manipulator
    endpoints:
      - endpoint_id: motion
        control_part: right_arm
        capabilities: [kinematics.batch_inverse, motion.cartesian_pose, kinematics.forward]
      - endpoint_id: grasp
        control_part: right_eef
        capabilities: [interaction.grasp]
        command_preset: right_parallel_jaw_commands
command_presets:
  - preset_id: right_parallel_jaw_commands
    control_part: right_eef
    commands:
      open: [0.05, 0.05]
      grasp: [0.0, 0.0]
