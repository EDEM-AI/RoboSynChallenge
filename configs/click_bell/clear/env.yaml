environment_id: click_bell_clear
physics: default
max_episodes: 100
max_episode_steps: 361
simulation:
  light:
    direct:
    - uid: light_0
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      init_pos:
      - 0.8
      - 0.0
      - 2.0
      radius: 20.0
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.0
      - 1.0
      - 0.1
      visual_material:
        uid: white_table_mat
        base_color:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.775
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_back_wall
    shape:
      shape_type: Cube
      size:
      - 0.04
      - 2.2
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  articulation:
  - uid: button
    fpath: ../../../assets/button/button.urdf
    init_pos:
    - 0.7
    - 0.3
    - 0.83
    init_rot:
    - 0
    - 0
    - 0
    attrs:
      mass_props:
        mass: 0.01
      material_props:
        static_friction: 0.5
        dynamic_friction: 0.5
    joint_drive_props:
      drive_type: force
      stiffness: 100.0
      damping: 30.0
      max_effort: 200.0
      max_velocity: 2.0
    asset_physics_mode: overlay
env:
  task_instruction: Click the bell
  target_control_frequency: 25
  events:
    init_button_pose:
      func: randomize_articulation_root_pose
      mode: reset
      params:
        entity_cfg:
          uid: button
        position_range:
        - - 0.4
          - -0.3
          - 0.83
        - - 0.85
          - 0.3
          - 0.83
        relative_position: false
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/click_bell
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Click the bell
        extra:
          scene_type: Sim
          task_description: Click the bell
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
