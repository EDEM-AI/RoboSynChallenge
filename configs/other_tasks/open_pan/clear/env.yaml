    - -0.2
    - 0.83
    init_rot:
    - 0.0
    - 0.0
    - 0.0
    body_scale:
    - 0.031
    - 0.03
    - 0.03
env:
  extensions:
    align_lid_before_release: true
  task_instruction: Lift the pan lid, put the carrot in the pan, and close the lid.
  target_control_frequency: 25
  events:
    init_pan_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: pan
        position_range:
        - - 0.5
          - 0.05
          - 0.83
        - - 0.65
          - 0.25
          - 0.83
        relative_position: false
    sync_lid_to_pan:
      func: sync_object_xy_position
      mode: reset
      params:
        target_entity_cfg:
          uid: lid
        reference_entity_cfg:
          uid: pan
        position_offset:
        - 0.0
        - 0.0
        - 0.1
    init_carrot_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: carrot
        position_range:
        - - 0.4
          - -0.25
          - 0.83
        - - 0.65
          - -0.1
          - 0.83
        relative_position: false
    wait_for_reset_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: lid
        - uid: carrot
        min_steps: 10
        max_steps: 120
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/other_tasks/open_pan
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Lift the pan lid, put the carrot in the pan, and close the lid.
        extra:
          scene_type: Sim
          task_description: other_open_pan
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
