integration_id: robosyn_other_pour_water
program_id: other_pour_water
requires:
  scene_contract: robosyn_other_pour_water
  embodiment_contract: cobotmagic_parallel_grippers
scene_binding:
  contract_id: robosyn_other_pour_water
  registry_id: robosyn_other_pour_water
  rigid_objects:
  - entity_id: cup
    dynamics: dynamic
    affordances:
    - entity_id: cup_grasp
      kind: antipodal_grasp
  - entity_id: bottle
    dynamics: dynamic
    affordances:
    - entity_id: bottle_grasp
      kind: antipodal_grasp
      internal_axis:
      - 1.0
      - 0.0
      - 0.0
profile:
  defaults: {}
  skill_options:
    pick:
      kind: pick_up
      pre_grasp_distance: 0.055
      approach_direction:
      - 0.35
      - 0.0
      - -1.0
      lift_height: 0.075
      grasp_settle_steps: 12
      hand_interp_steps: 12
    robosyn.pick_bottle:
      kind: pick_up
      pre_grasp_distance: 0.055
      approach_direction:
      - 0.85
      - 0.25
      - -0.25
      lift_height: 0.075
      grasp_settle_steps: 12
      hand_interp_steps: 12
    robosyn.position_bottle_to_pour:
      kind: move_held_object
    simulation.pour:
      kind: pour
      rotate_angle: -1.1
  effect_monitors:
    pick:
      monitor_id: builtin.composite_effect
      revision: '1'
      params:
        consecutive_samples: 1
    robosyn.pick_bottle:
      monitor_id: builtin.composite_effect
      revision: '1'
      params:
        consecutive_samples: 1
    robosyn.position_bottle_to_pour:
      monitor_id: builtin.composite_effect
      revision: '1'
      params:
        consecutive_samples: 1
runtime_services:
  control_part_evidence:
    kind: joint_position_constraint
    control_parts:
    - right_eef
    - left_eef
    open_qpos:
    - 0.05
    - 0.05
    minimum_displacement: 0.005
  registered_semantic_lowerers:
  - kind: pour
    object_id: bottle
