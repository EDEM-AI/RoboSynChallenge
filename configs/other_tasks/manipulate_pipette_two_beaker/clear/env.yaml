        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
