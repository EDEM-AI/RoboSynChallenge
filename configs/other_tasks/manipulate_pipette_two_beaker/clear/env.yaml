      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  rigid_object:
  - uid: beaker1
    shape:
      shape_type: Mesh
      fpath: ../../../../assets/Beaker/beaker.ply
      collision:
        approximation: convex_decomposition
        max_hulls: 24
    attrs:
      mass_props:
        mass: 0.05
      material_props:
        static_friction: 0.5
        dynamic_friction: 0.3
        restitution: 0.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.00025
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 1.0
        min_position_iters: 32
        min_velocity_iters: 8
    body_scale:
