    - 0.0
    - 0.83
    init_rot:
    - 0
    - 0
    - 0
  - uid: beaker2
    shape:
      shape_type: Mesh
      fpath: ../../../../assets/Beaker/beaker.ply
      collision:
        approximation: convex_decomposition
        max_hulls: 24
    attrs:
      mass_props:
        mass: 0.05
      material_props:
        static_friction: 0.5
        dynamic_friction: 0.3
        restitution: 0.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.00025
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 1.0
        min_position_iters: 32
        min_velocity_iters: 8
    body_scale:
    - 1.4
    - 1.4
    - 1.5
    init_pos:
    - 0.65
    - 0.0
    - 0.83
    init_rot:
    - 0
    - 0
    - 0
  articulation:
  - uid: pipette
    fpath: ../../../../assets/pipette_good/pipette_good.urdf
    build_pk_chain: false
    init_pos:
    - 0.6
    - -0.25
    - 0.86
    init_rot:
    - 0
    - -7
    - 0
    init_qpos:
    - 0.01401
    body_scale:
    - 3
    - 3
    - 3
    compute_uv: true
    attrs:
      material_props:
        static_friction: 1.8
        dynamic_friction: 1.5
        restitution: 0.0
      collision_props:
        contact_offset: 0.0001
        rest_offset: 2.5e-05
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 2.0
        linear_damping: 2.0
        angular_damping: 2.0
        max_linear_velocity: 2.0
        max_angular_velocity: 2.0
        min_position_iters: 32
        min_velocity_iters: 16
    root_props:
      fixed_base: false
    joint_drive_props:
      drive_type: force
      stiffness: 100.0
      damping: 30.0
      max_effort: 200.0
      max_velocity: 2.0
    asset_physics_mode: overlay
env:
  task_instruction: Transfer liquid between the beakers by pressing and releasing
    the pipette above each one.
  target_control_frequency: 25
  events:
    set_beaker1_material:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: beaker1
        mat_cfg:
          uid: beaker1_mat
          base_color:
          - 1.0
          - 1.0
          - 0.999
          - 1.0
          ior: 1.47
          roughness: 0.005
          metallic: 0.0
          transmission: 1.0
    set_beaker2_material:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: beaker2
        mat_cfg:
          uid: beaker2_mat
          base_color:
          - 1.0
          - 1.0
          - 0.999
          - 1.0
          ior: 1.47
          roughness: 0.005
          metallic: 0.0
          transmission: 1.0
    random_beaker1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: beaker1
        position_range:
        - - 0.48
          - -0.05
          - 0.83
        - - 0.54
          - 0.18
          - 0.83
        rotation_range:
        - - 0
          - 0
          - -180
        - - 0
          - 0
          - 180
        relative_position: false
        relative_rotation: true
    random_beaker2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: beaker2
        position_range:
        - - 0.6
          - -0.05
          - 0.83
        - - 0.66
          - 0.18
          - 0.83
        rotation_range:
        - - 0
          - 0
          - -180
        - - 0
          - 0
          - 180
        relative_position: false
        relative_rotation: true
    random_pipette_pose:
      func: randomize_articulation_root_pose
      mode: reset
      params:
        entity_cfg:
          uid: pipette
        position_range:
        - - 0.45
          - -0.28
          - 0.86
        - - 0.72
          - -0.1
          - 0.86
        rotation_range:
        - - 0
          - 0
          - -30
        - - 0
          - 0
          - 30
        relative_position: false
        relative_rotation: true
    wait_for_reset_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: beaker1
        - uid: beaker2
        - uid: pipette
        min_steps: 10
        max_steps: 120
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
    beaker_1_pose:
      func: get_rigid_object_pose
      mode: add
      name: beaker1_pose
      params:
        entity_cfg:
          uid: beaker1
    pipette_pose:
      func: get_object_pose
      mode: add
      name: pipette_pose
      params:
        entity_cfg:
          uid: pipette
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/other_tasks/manipulate_pipette_two_beaker
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Transfer liquid between the beakers by pressing and releasing the
            pipette above each one.
        extra:
          scene_type: Sim
          task_description: other_manipulate_pipette_two_beaker
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
