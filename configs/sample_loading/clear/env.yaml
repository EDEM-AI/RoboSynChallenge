environment_id: sample_loading_clear
physics: default
max_episodes: 100
max_episode_steps: 1500
simulation:
  light:
    direct:
    - uid: light_0
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      init_pos:
      - 0.8
      - 0.0
      - 2.0
      radius: 20.0
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.0
      - 1.0
      - 0.1
      visual_material:
        uid: white_table_mat
        base_color:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.775
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_back_wall
    shape:
      shape_type: Cube
      size:
      - 0.04
      - 2.2
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: rack
    body_type: static
    shape:
      shape_type: Mesh
      fpath: ../../../assets/test_tube_rack_standard.ply
      compute_uv: true
      collision:
        approximation: triangle_mesh
    attrs:
      mass_props:
        mass: 5.0
      material_props:
        restitution: 0.0
      collision_props:
        contact_offset: 0.0002
        rest_offset: 5.0e-05
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 1.0
        min_position_iters: 32
        min_velocity_iters: 8
    init_pos:
    - 0.66
    - 0.0
    - 0.865
    init_rot:
    - 0
    - 0
    - 0
    body_scale:
    - 1.1
    - 1.1
    - 1.1
  rigid_object:
  - uid: cube
    shape:
      shape_type: Mesh
      fpath: ../../../assets/test_tube_standard.ply
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 24
    attrs:
      mass_props:
        mass: 0.02
      material_props:
        static_friction: 1.9
        dynamic_friction: 1.6
        restitution: 0.0
      collision_props:
        contact_offset: 0.0002
        rest_offset: 5.0e-05
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 1.0
        min_position_iters: 32
        min_velocity_iters: 8
    body_scale:
    - 1.0
    - 1.0
    - 1.3
    init_pos:
    - 0.56
    - -0.2
    - 0.86
    init_rot:
    - 0
    - 90
    - 0
env:
  extensions:
    shallow_tube_handover: true
  task_instruction: Pick up the test tube, and it to the other arm, and insert it
    to the rack.
  target_control_frequency: 25
  events:
    set_cube_material:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: cube
        mat_cfg:
          uid: cube_mat
          base_color:
          - 1.0
          - 0.99
          - 1.0
          - 1.0
          ior: 1.47
          roughness: 0.08
          metallic: 0.0
          transmission: 1.0
          emissive:
          - 0.04
          - 0.06
          - 0.07
    random_cube_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: cube
        position_range:
        - - 0.45
          - -0.28
          - 0.86
        - - 0.68
          - -0.05
          - 0.86
        rotation_range:
        - - -20
          - 0
          - 0
        - - 20
          - 0
          - 0
        relative_position: false
        relative_rotation: true
    random_rack_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: rack
        position_range:
        - - 0.63
          - 0.05
          - 0.865
        - - 0.7
          - 0.15
          - 0.865
        rotation_range:
        - - 0
          - 0
          - 0
        - - 0
          - 0
          - 90
        relative_position: false
        relative_rotation: true
    settle_task_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: cube
        min_steps: 12
        max_steps: 90
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/sample_loading/
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Pick up the test tube, and it to the other arm, and insert it to the
            rack.
        extra:
          scene_type: Sim
          task_description: sample_loading
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
