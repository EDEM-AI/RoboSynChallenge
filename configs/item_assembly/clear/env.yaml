    - 0
    - 0
    - 0
  rigid_object:
  - uid: guijiao2
    shape:
      shape_type: Mesh
      fpath: ../../../assets/guijiao_standard/1guijiao_standard.ply
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    attrs:
      mass_props:
        mass: 0.006
      material_props:
        static_friction: 2.0
        dynamic_friction: 2.0
        restitution: 0.01
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.0005
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
    init_pos:
    - 0.6
    - 0.16
    - 0.8
    body_scale:
    - 2
    - 2
    - 2
  - uid: guijiao1
    shape:
      shape_type: Mesh
      fpath: ../../../assets/guijiao_standard/2guijiao_standard.ply
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    attrs:
      mass_props:
        mass: 0.01
      material_props:
        static_friction: 2.0
        dynamic_friction: 2.0
        restitution: 0.01
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
    init_pos:
    - 0.6
    - -0.15
    - 0.8
    body_scale:
    - 1.7
    - 1.7
    - 1.7
env:
  task_instruction: Pick up two centrifuge tubes from the table and dock them horizontally.
  target_control_frequency: 25
  events:
    init_guijiao1_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: guijiao1
        position_range:
        - - -0.05
          - -0.01
          - 0.0
        - - 0.08
          - 0.01
          - 0.0
        relative_position: true
    init_guijiao2_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: guijiao2
        position_range:
        - - -0.08
          - -0.02
          - 0.0
        - - 0.08
          - 0.05
          - 0.0
        relative_position: true
    settle_task_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: guijiao1
        - uid: guijiao2
        min_steps: 12
        max_steps: 90
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
    guijiao1_pose:
      func: get_rigid_object_pose
      mode: add
      name: guijiao1_pose
      params:
        entity_cfg:
          uid: guijiao1
    guijiao2_pose:
      func: get_rigid_object_pose
      mode: add
      name: guijiao2_pose
      params:
        entity_cfg:
          uid: guijiao2
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/item_assembly
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Pick up two centrifuge tubes from the table and dock them horizontally.
        extra:
          scene_type: Sim
          task_description: item_assembly
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
