environment_id: drawer_open_place_clear
physics: default
physics_config:
  enable_ccd: true
max_episodes: 100
max_episode_steps: 1400
simulation:
  light:
    indirect:
      emission_light:
        color:
        - 1.0
        - 1.0
        - 1.0
        intensity: 180
    direct:
    - uid: light_0
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 15.0
      init_pos:
      - 0.8
      - 0.0
      - 2.0
      radius: 20.0
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.0
      - 1.0
      - 0.1
      visual_material:
        uid: white_table_mat
        base_color:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.775
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_back_wall
    shape:
      shape_type: Cube
      size:
      - 0.04
      - 2.2
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  rigid_object:
  - uid: duck
    shape:
      shape_type: Mesh
      fpath: ../../../assets/tomato/tomato_asset_simready/asset_simready.obj
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    body_scale:
    - 0.8
    - 0.8
    - 0.8
    init_pos:
    - 0.65
    - 0.16
    - 0.87
    init_rot:
    - 90
    - 0
    - 0
    attrs:
      mass_props:
        mass: 0.1
      material_props:
        static_friction: 5.0
        dynamic_friction: 5.0
        restitution: 0.0
      collision_props:
        contact_offset: 0.004
        rest_offset: 0.0015
      rigid_props:
        max_depenetration_velocity: 2.0
        min_position_iters: 32
        min_velocity_iters: 8
  rigid_object_group: []
  articulation:
  - fpath: SlidingBoxDrawer/SlidingBoxDrawer.urdf
    uid: drawer
    init_pos:
    - 0.8
    - 0.0
    - 0.9
    body_scale:
    - 1.0
    - 1.0
    - 0.35
    init_rot:
    - 0.3
    - 0
    - 180
    attrs:
      material_props:
        static_friction: 5.0
        dynamic_friction: 4.8
      rigid_props:
        enable_ccd: true
    root_props:
      min_position_iters: 32
      min_velocity_iters: 8
    joint_drive_props:
      drive_type: none
      stiffness: 5.0
      damping: 1.5
    asset_physics_mode: overlay
  - fpath: SlidingBoxDrawer/SlidingBoxDrawer.urdf
    uid: drawer_background
    init_pos:
    - 0.8
    - 0.0
    - 0.825
    body_scale:
    - 1.0
    - 1.0
    - 0.35
    init_rot:
    - 0.3
    - 0
    - 180
    attrs:
      material_props:
        static_friction: 5.0
        dynamic_friction: 4.8
      rigid_props:
        enable_ccd: true
    joint_drive_props:
      drive_type: none
      stiffness: 10.0
      damping: 3.0
    asset_physics_mode: overlay
env:
  task_instruction: Open the drawer, pick the tomato with the other arm then place
    it in the drawer.
  target_control_frequency: 25
  events:
    set_drawer_material:
      func: set_articulation_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: drawer
        mat_cfg:
          uid: white_drawer_mat
          base_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
          metallic: 0.0
          roughness: 1.0
    set_drawer_background_material:
      func: set_articulation_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: drawer_background
        mat_cfg:
          uid: dark_gray_drawer_background_mat
          base_color:
          - 0.05
          - 0.05
          - 0.05
          - 1.0
          metallic: 0.0
          roughness: 1.0
    random_duck_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: duck
        position_range:
        - - 0.53
          - 0.18
          - 0.87
        - - 0.8
          - 0.35
          - 0.87
        rotation_range:
        - - 0
          - 0
          - -30
        - - 0
          - 0
          - 30
        relative_position: false
        relative_rotation: true
    random_drawer_pose:
      func: randomize_entity_root_pose_group
      mode: reset
      params:
        entity_cfgs:
        - uid: drawer
        - uid: drawer_background
        position_range:
        - - -0.15
          - -0.18
          - 0.0
        - - 0.0
          - 0.0
          - 0.0
        rotation_range:
        - - 0.3
          - 0
          - 180
        - - 0.3
          - 0
          - 180
        relative_position: true
        relative_rotation: false
        physics_update_step: 1
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/drawer_open_place
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Open the drawer, pick the tomato with the other arm then place it
            in the drawer.
        extra:
          scene_type: Sim
          task_description: drawer_open_place
          data_type: sim
        use_videos: true
  extensions: {}
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
