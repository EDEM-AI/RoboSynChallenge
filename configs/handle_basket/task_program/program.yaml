program_id: handle_basket
instruction: Put the milk carton into the basket and carry the basket to the left.
targets: {}
program:
  kind: sequence
  items:
  - kind: segment
    name: pick_milk
    instruction: Pick and lift the milk with the left arm.
    steps:
      kind: invoke
      call:
        kind: pick
        object: milk
        grasp: milk_grasp
        resources:
          primary: left_manipulator
    validators:
    - kind: object_lifted
      object: milk
      minimum_lift: 0.02
  - kind: segment
    name: place_milk
    instruction: Place the milk inside the basket interior.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.place_relative
        arguments:
          object: milk
          reference: basket
          relation: above
        resources:
          primary: left_manipulator
    post:
    - kind: wait_stable
      entity: milk
  - kind: segment
    name: clear_left_arm
    instruction: Move the empty left gripper clear of the basket's carry path.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.park
        arguments: {}
        resources:
          primary: left_manipulator
  - kind: segment
    name: pick_basket
    instruction: Pick and lift the basket with the right arm.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: robosyn.pick_basket_handle
        arguments: {}
        resources:
          primary: right_manipulator
    validators:
    - kind: object_lifted
      object: basket
      minimum_lift: 0.01
  - kind: segment
    name: carry_basket
    instruction: Carry the loaded basket to the left.
    steps:
      kind: invoke
      call:
        kind: registered
        call_id: simulation.move_held_object
        arguments:
          target: basket_destination
        resources:
          primary: right_manipulator
    post:
    - kind: wait_stable
      entity: basket
      preset: carry_loaded_basket
