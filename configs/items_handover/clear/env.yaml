environment_id: items_handover_clear
physics: default
max_episodes: 100
max_episode_steps: 1500
simulation:
  light:
    direct:
    - uid: light_0
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      init_pos:
      - 0.8
      - 0.0
      - 2.0
      radius: 20.0
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.0
      - 1.0
      - 0.1
      visual_material:
        uid: white_table_mat
        base_color:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.0
        dynamic_friction: 0.0
        restitution: 0.01
      collision_props:
        contact_offset: 0.0
        rest_offset: 0.0
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.775
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_back_wall
    shape:
      shape_type: Cube
      size:
      - 0.04
      - 2.2
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  rigid_object:
  - uid: holder
    shape:
      shape_type: Mesh
      fpath: ../../../assets/PenHolder/pen_holder.obj
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    attrs:
      mass_props:
        mass: 0.005
      material_props:
        restitution: 0.1
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
    init_pos:
    - 0.5
    - 0.1
    - 0.884
    init_rot:
    - 90
    - 0
    - 0
    body_scale:
    - 0.56
    - 0.45
    - 0.56
  - uid: pen
    shape:
      shape_type: Mesh
      fpath: ../../../assets/Pen/the_pen.obj
      compute_uv: true
      visual_material:
        uid: black_pen_mat
        base_color:
        - 0.0
        - 0.0
        - 0.0
        - 1.0
        metallic: 0.0
        roughness: 0.8
      collision:
        approximation: convex_decomposition
        max_hulls: 8
    attrs:
      mass_props:
        mass: 0.005
      material_props:
        restitution: 0.01
      collision_props:
        contact_offset: 0.003
        rest_offset: 0.001
      rigid_props:
        max_depenetration_velocity: 10.0
        min_position_iters: 32
        min_velocity_iters: 8
    init_pos:
    - 0.6
    - -0.1
    - 0.884
    init_rot:
    - 0
    - 0
    - 0
    body_scale:
    - 1
    - 1.6
    - 1.6
env:
  task_instruction: Pick up the pen, hand it over to the other arm and then place
    it in to the pen holder
  target_control_frequency: 25
  events:
    random_table_height:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: table
        position_range:
        - - 0.0
          - 0.0
          - -0.05
        - - 0.0
          - 0.0
          - 0.05
        relative_position: true
    random_holder_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: holder
        position_range:
        - - 0.5
          - 0.0
          - 0.884
        - - 0.7
          - 0.25
          - 0.884
        relative_position: false
    random_pen_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: pen
        position_range:
        - - 0.52
          - -0.3
          - 0.884
        - - 0.675
          - 0.0
          - 0.884
        rotation_range:
        - - 0
          - 0
          - -30
        - - 0
          - 0
          - 30
        relative_position: false
        relative_rotation: true
    settle_task_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: pen
        - uid: holder
        min_steps: 12
        max_steps: 90
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/items_handover/
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Pick up the pen, hand it over to the other arm and then place it in
            to the pen holder
        extra:
          scene_type: Sim
          task_description: items_handover
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
