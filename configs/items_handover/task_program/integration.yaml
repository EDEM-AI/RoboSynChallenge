integration_id: robosyn_items_handover
program_id: items_handover
requires:
  scene_contract: robosyn_items_handover
  embodiment_contract: cobotmagic_parallel_grippers
scene_binding:
  contract_id: robosyn_items_handover
  registry_id: robosyn_items_handover
  rigid_objects:
  - entity_id: pen
    dynamics: dynamic
    simulation_uid: pen
    affordances:
    - entity_id: pen_grasp
      kind: antipodal_grasp
  - entity_id: holder
    dynamics: dynamic
    affordances:
    - entity_id: holder_opening
      kind: container
      native_name: holder_opening
      object_target_pose:
        position: [0.0, 0.05, 0.0]
        quaternion_xyzw: [0.0, 0.0, 0.7071067811865476, 0.7071067811865476]
      release_clearance: 0.015
profile:
  defaults: {}
  skill_options:
    pick:
      kind: pick_up
      pre_grasp_distance: 0.05
      lift_height: 0.065
      approach_direction: [0.32, 0.50, -1.0]
      grasp_settle_steps: 12
      hand_interp_steps: 12
    hand_over:
      kind: hand_over
      arm_selection: bound
      release_at_target: false
      pre_grasp_distance: 0.035
      receive_pick_object_part: center
      lift_height: 0.0
      hand_interp_steps: 20
      hold_steps: 12
      retreat_distance: 0.012
      retreat_steps: 50
    robosyn.align_for_insertion:
      kind: move_joints
    simulation.place_relative:
      kind: place
      lift_height: 0.025
      cartesian_waypoint_count: 1
      hand_interp_steps: 18
      release_settle_steps: 30
  effect_monitors: {}
  grounding_providers:
    hand_over: simulation.configured_handover_pose
runtime_services:
  grasp_pose_generator_overrides:
    left_eef:
      filter_ground_collision: false
      sample_count: 5000
      point_spacing: 0.003
  handover_pose_providers:
  - kind: configured_pose
    final_position:
    - 0.53
    - 0.02
    - 0.965
    final_quaternion_xyzw:
    - 0.0
    - 0.0
    - 0.0
    - 1.0
  registered_semantic_lowerers:
  - kind: place_relative
    routes:
    - object_id: pen
      reference_entity_id: holder
      relation: above
      world_displacement: [0.0, 0.0, 0.171]
