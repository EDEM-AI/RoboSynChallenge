environment_id: mixer_operating_clear
physics: default
render_cfg:
  renderer: rt
max_episodes: 100
max_episode_steps: 1500
simulation:
  light:
    direct:
    - uid: light_0
      light_type: point
      color:
      - 1.0
      - 1.0
      - 1.0
      intensity: 5.0
      init_pos:
      - 0.8
      - 0.0
      - 2.0
      radius: 20.0
  background:
  - uid: table
    shape:
      shape_type: Cube
      size:
      - 1.0
      - 1.0
      - 0.1
      visual_material:
        uid: white_table_mat
        base_color:
        - 1.0
        - 1.0
        - 1.0
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.725
    - 0.0
    - 0.775
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_back_wall
    shape:
      shape_type: Cube
      size:
      - 0.04
      - 2.2
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 1.18
    - 0.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_left_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - 1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  - uid: green_right_wall
    shape:
      shape_type: Cube
      size:
      - 0.9
      - 0.04
      - 1.6
      visual_material:
        uid: real_green_wall_mat
        base_color:
        - 0.0
        - 0.48
        - 0.16
        - 1.0
        metallic: 0.0
        roughness: 1.0
    attrs:
      mass_props:
        mass: 10.0
      material_props:
        static_friction: 0.95
        dynamic_friction: 0.9
        restitution: 0.01
    body_scale:
    - 1
    - 1
    - 1
    body_type: kinematic
    init_pos:
    - 0.74
    - -1.0
    - 0.8
    init_rot:
    - 0
    - 0
    - 0
  rigid_object:
  - uid: beaker
    shape:
      shape_type: Mesh
      fpath: ../../../assets/Beaker/beaker.ply
      compute_uv: true
      collision:
        approximation: convex_decomposition
        max_hulls: 24
    attrs:
      mass_props:
        mass: 0.1
      material_props:
        static_friction: 1.5
        dynamic_friction: 0.3
        restitution: 0.0
      collision_props:
        contact_offset: 0.01
        rest_offset: 0.0025
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 1.0
        min_position_iters: 32
        min_velocity_iters: 8
    body_scale:
    - 1.4
    - 1.4
    - 1.5
    init_pos:
    - 0.7
    - -0.25
    - 0.85
    init_rot:
    - 0
    - 0
    - 0
  - uid: beaker_mixer
    shape:
      shape_type: Mesh
      fpath: ../../../assets/beaker_mixer/beaker_mixer.obj
      compute_uv: false
      collision:
        approximation: convex_decomposition
        max_hulls: 12
    attrs:
      mass_props:
        mass: 5.0
      material_props:
        static_friction: 1.2
        dynamic_friction: 1.0
        restitution: 0.0
      collision_props:
        contact_offset: 0.001
        rest_offset: 0.00025
      rigid_props:
        enable_ccd: true
        max_depenetration_velocity: 1.0
        min_position_iters: 32
        min_velocity_iters: 8
    body_scale:
    - 0.3
    - 0.3
    - 0.3
    init_pos:
    - 0.6
    - 0.0
    - 0.9
    init_rot:
    - 90
    - -90
    - 0
env:
  task_instruction: Pick the beaker, place it on the mixer, then flip the toggle switch
    with the other arm.
  target_control_frequency: 25
  events:
    set_beaker_material:
      func: set_rigid_object_visual_material
      mode: startup
      params:
        entity_cfg:
          uid: beaker
        mat_cfg:
          uid: beaker_mat
          base_color:
          - 1.0
          - 1.0
          - 0.999
          - 1.0
          ior: 1.47
          roughness: 0.005
          metallic: 0.0
          preset: GlassClearSurface
    random_beaker_mixer_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: beaker_mixer
        position_range:
        - - 0.54
          - 0.0
          - 0.9
        - - 0.65
          - 0.1
          - 0.9
        rotation_range:
        - - 0
          - 0
          - 0
        - - 0
          - 0
          - 0
        relative_position: false
        relative_rotation: true
    random_beaker_pose:
      func: randomize_rigid_object_pose
      mode: reset
      params:
        entity_cfg:
          uid: beaker
        position_range:
        - - 0.63
          - -0.25
          - 0.85
        - - 0.75
          - -0.2
          - 0.85
        rotation_range:
        - - 0
          - 0
          - -180
        - - 0
          - 0
          - 180
        relative_position: false
        relative_rotation: true
    settle_task_objects:
      func: wait_for_dynamic_objects_to_settle
      mode: reset
      params:
        entity_cfgs:
        - uid: beaker
        - uid: beaker_mixer
        min_steps: 12
        max_steps: 90
  observations:
    norm_robot_eef_joint:
      func: normalize_robot_joint_data
      mode: modify
      name: robot/qpos
      params:
        joint_ids:
        - 6
        - 13
  dataset:
    lerobot:
      func: LeRobotRecorder
      mode: save
      params:
        save_path: lerobot_dataset/mixer_operating
        robot_meta:
          robot_type: CobotMagic
          control_freq: 25
          control_parts:
          - left_arm
          - left_eef
          - right_arm
          - right_eef
        instruction:
          lang: Pick the beaker, place it on the mixer, then flip the toggle switch
            with the other arm.
        extra:
          scene_type: Sim
          task_description: mixer_operating
          data_type: sim
        use_videos: true
  control_parts:
  - left_arm
  - left_eef
  - right_arm
  - right_eef
