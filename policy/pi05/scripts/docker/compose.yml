# Run from the repository root with docker compose -f policy/pi05/scripts/docker/compose.yml up --build
services:
  openpi_server:
    image: robosyn-pi05
    build:
      context: ../../../..
      dockerfile: policy/pi05/scripts/docker/serve_policy.Dockerfile
    init: true
    tty: true
    network_mode: host
    # Populate configured openpi data home to /openpi_assets inside the container.
    # Populate aws credential inside the container.
    volumes:
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
      - ${OPENPI_CHECKPOINT_DIR:-../../checkpoints}:/app/policy/pi05/checkpoints:ro
    environment:
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true

    # Comment out this block if not running on a machine with GPUs.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
