# π₀ Policy Evaluation Configuration
# 用法:
#   python scripts/eval_policy.py --config policy/pi0/deploy_policy.yml \
#       --policy_name pi0 --task_name click_bell --setting random \
#       --train_config_name my_train_config --model_name pi0_base \
#       --checkpoint_id 30000 --pi0_step 50 \
#       --max_episodes 100 --seed 0

policy_name: pi0

# env settings
task_name: null
setting: null

# PI0 model parameters
train_config_name: null
model_name: null
checkpoint_id: null
pi0_step: 1000 # It only represents the number of execution steps.
pytorch_device: cpu

# Evaluation settings
max_episodes: 10
# Maximum environment steps per episode. Effective limit is
# max(deploy_config.max_steps, gym_config.max_episode_steps).
max_steps: 10
seed: 0
headless: false
filter_dataset_saving: true

# Evaluation video recording
eval_video_log: true
eval_save_dir: eval_result
eval_video_obs_key: cam_high
eval_video_fps: 10
eval_video_crf: 23
# note: The pi0 and robosyc environments have version conflicts with the lerobot version.
# Using the pi0 version prevents the simulation environment from saving the lerobot version.
